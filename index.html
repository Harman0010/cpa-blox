<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claim Your Reward</title>
    <!-- Google Fonts üzerinden Fredoka yazı tipini çağırıyoruz -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #51e1ec 0%, #4ce4b1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Sağ Üst Dil Seçim Kutusu */
        .lang-selector {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
        }
        .lang-selector select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            color: #333;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Ana Kart Tasarımı */
        .container {
            background: white;
            border-radius: 28px;
            width: 100%;
            max-width: 440px;
            padding: 30px 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
            border: 4px solid #e0f9f1;
            text-align: center;
            position: relative;
        }

        /* Adım Geçiş Animasyonları */
        .step {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 26px;
            color: #222;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #fff;
            font-weight: 700;
        }

        .label {
            font-size: 18px;
            color: #444;
            font-weight: 600;
            text-align: left;
            margin-bottom: 8px;
            display: block;
        }

        /* Form Girdi Alanları */
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 3px solid #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 22px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        input[type="text"]:focus {
            border-color: #4ce4b1;
            background: white;
        }

        /* Butonlar İçin 3D Efekt Tasarımı */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            font-size: 26px;
            font-weight: 700;
            color: white;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.1s, filter 0.2s;
            display: inline-block;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.98);
        }

        .btn-green {
            background: #4de53b;
            border-bottom: 6px solid #36b127;
            text-shadow: 2px 2px 0px #319e24;
        }
        .btn-green:hover {
            filter: brightness(1.05);
        }

        .btn-red {
            background: #ff4747;
            border-bottom: 6px solid #cc2d2d;
            text-shadow: 2px 2px 0px #ba2323;
        }
        .btn-red:hover {
            filter: brightness(1.05);
        }

        /* Kullanıcı Doğrulama Kartı */
        .profile-card {
            background: #f7f7f7;
            border-radius: 18px;
            border: 2px solid #eaeaea;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 24px;
            text-align: left;
            position: relative;
        }
        .avatar-box {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #e0e0e0;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-right: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-info h4 {
            font-size: 20px;
            color: #222;
            font-weight: 700;
            word-break: break-all;
        }
        .profile-info p {
            font-size: 15px;
            color: #777;
            font-weight: 400;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Görev Duvarı Tasarımı */
        .quest-subtitle {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .quest-subtitle span {
            color: #4de53b;
            font-weight: 700;
        }
        .offer-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }
        .offer-btn {
            font-size: 16px !important;
            padding: 12px 14px !important;
            text-shadow: none !important;
            text-transform: none !important;
            border-radius: 14px !important;
        }

        /* Kilitli Kod Görseli */
        .lock-box {
            background: #2b303a;
            border-radius: 14px;
            padding: 14px;
            color: #a0a5b5;
            font-weight: 600;
            font-size: 14px;
            border: 2px dashed #444a56;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .lock-code {
            color: #f1c40f;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .loading {
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="lang-selector">
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="tr">Türkçe</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <div class="container">
        
        <!-- ADIM 1: KULLANICI ADI GİRİŞİ -->
        <div id="step1" class="step active">
            <h2 id="t-step1-title">Claim Your Reward</h2>
            <label class="label" id="t-label-code">Enter your code</label>
            <input type="text" id="promoCode" value="BG498" readonly>
            
            <label class="label" id="t-label-user">Roblox username</label>
            <input type="text" id="usernameInput" placeholder="Your username...">
            
            <button class="btn btn-green" id="btn-claim" onclick="processStep1()">Claim</button>
        </div>

        <!-- ADIM 2: PROFİL DOĞRULAMA -->
        <div id="step2" class="step">
            <h2 id="t-step2-title">Confirm Username</h2>
            <p class="quest-subtitle" id="t-is-this-you" style="margin-top:-10px; margin-bottom:15px;">Is this you?</p>
            
            <div class="profile-card">
                <div class="avatar-box">
                    <img id="userAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ccc'/></svg>" alt="Avatar">
                </div>
                <div class="profile-info">
                    <h4 id="displayUsername">Player</h4>
                    <p id="atUsername">@player</p>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-green" id="btn-yes" onclick="goToStep3()">Yes, it's me!</button>
                <button class="btn btn-red" id="btn-no" onclick="goBackToStep1()">No, try again</button>
            </div>
        </div>

        <!-- ADIM 3: GÖREVLER (OFFERWALL) -->
        <div id="step3" class="step">
            <h2 id="t-step3-title">Final Step</h2>
            <p class="quest-subtitle" id="t-quest-desc">Complete <span>2 quests</span> to unlock your 1,000 Robux Giftcard</p>
            
            <div class="offer-list" id="offerContainer">
                <!-- Butonlar JavaScript ile otomatik yüklenecek -->
            </div>

            <div class="lock-box">
                <div class="lock-code">
                    🔒 RB??-????-????-????
                </div>
                <span id="t-lock-status">your code unlocks after completion...</span>
            </div>
        </div>

    </div>

    <script>
// Dil Paketleri Veri Tabanı
const translations = {
    en: {
        s1Title: "Claim Your Reward", s1Code: "Enter your code", s1User: "Roblox username", s1Btn: "Claim", s1Place: "Your username...",
        s2Title: "Confirm Username", s2You: "Is this you?", s2Yes: "Yes, it's me!", s2No: "No, try again",
        s3Title: "Final Step", s3Desc: "Complete <span>2 quests</span> to unlock your 1,000 Robux Giftcard", s3Lock: "your code unlocks after completion..."
    },
    tr: {
        s1Title: "Ödülünü Talep Et", s1Code: "Kodunuzu girin", s1User: "Roblox kullanıcı adı", s1Btn: "Talep Et", s1Place: "Kullanıcı adınız...",
        s2Title: "Kullanıcı Adını Onayla", s2You: "Bu sen misin?", s2Yes: "Evet, benim!", s2No: "Hayır, tekrar dene",
        s3Title: "Son Adım", s3Desc: "1,000 Robux Hediye Kartının kilidini açmak için <span>2 görevi</span> tamamlayın", s3Lock: "görevler tamamlandıktan sonra kod açılır..."
    },
    es: {
        s1Title: "Reclama tu Recompensa", s1Code: "Introduce tu código", s1User: "Nombre de usuario de Roblox", s1Btn: "Reclamar", s1Place: "Tu usuario...",
        s2Title: "Confirmar Usuario", s2You: "¿Eres tú?", s2Yes: "¡Sí, soy yo!", s2No: "No, intentar de nuevo",
        s3Title: "Paso Final", s3Desc: "Completa <span>2 misiones</span> para desbloquear tu tarjeta de 1,000 Robux", s3Lock: "tu código se desbloquea tras completarlo..."
    },
    pt: {
        s1Title: "Resgate sua Recompensa", s1Code: "Insira seu código", s1User: "Nome de usuário do Roblox", s1Btn: "Resgatar", s1Place: "Seu usuário...",
        s2Title: "Confirmar Usuário", s2You: "É você?", s2Yes: "Sim, sou eu!", s2No: "Não, tentar de novamente",
                s3Title: "Passo Final", s3Desc: "Complete <span>2 missões</span> para desbloquear seu vale de 1,000 Robux", s3Lock: "seu código será desbloqueado após a conclusão..."
    },
    de: {
        s1Title: "Belohnung Einfordern", s1Code: "Code eingeben", s1User: "Roblox-Benutzername", s1Btn: "Einfordern", s1Place: "Dein Benutzername...",
        s2Title: "Benutzername Bestätigen", s2You: "Bist du das?", s2Yes: "Ja, das bin ich!", s2No: "Nein, anderer Name",
        s3Title: "Letzter Schritt", s3Desc: "Schließe <span>2 Aufgaben</span> ab, um deine 1,000 Robux Karte freizuschalten", s3Lock: "Ihr Code wird nach Abschluss freigeschaltet..."
    },
    fr: {
        s1Title: "Réclamez Votre Récompense", s1Code: "Entrez votre code", s1User: "Nom d'utilisateur Roblox", s1Btn: "Réclamer", s1Place: "Votre nom d'utilisateur...",
        s2Title: "Confirmer l'utilisateur", s2You: "Est-ce bien vous?", s2Yes: "Oui, c'est moi!", s2No: "Non, réessayer",
                s3Title: "Étape Finale", s3Desc: "Remplissez <span>2 missions</span> pour débloquer votre carte de 1,000 Robux", s3Lock: "votre code se débloque après exécution..."
    }
};

let currentLang = 'en';

window.addEventListener('DOMContentLoaded', () => {
    // Tarayıcı Dil Kontrolü
    const userLang = navigator.language || navigator.userLanguage;
    const shortLang = userLang.substring(0, 2).toLowerCase();
    if (translations[shortLang]) {
        currentLang = shortLang;
        document.getElementById('langSelect').value = shortLang;
    }
    updateDOMTexts();
});

function changeLanguage(lang) {
    currentLang = lang;
    updateDOMTexts();
}

function updateDOMTexts() {
    const t = translations[currentLang];
    document.getElementById('t-step1-title').innerText = t.s1Title;
    document.getElementById('t-label-code').innerText = t.s1Code;
    document.getElementById('t-label-user').innerText = t.s1User;
    document.getElementById('btn-claim').innerText = t.s1Btn;
    document.getElementById('usernameInput').placeholder = t.s1Place;
    document.getElementById('t-step2-title').innerText = t.s2Title;
    document.getElementById('t-is-this-you').innerText = t.s2You;
    document.getElementById('btn-yes').innerText = t.s2Yes;
    document.getElementById('btn-no').innerText = t.s2No;
    document.getElementById('t-step3-title').innerText = t.s3Title;
    document.getElementById('t-quest-desc').innerHTML = t.s3Desc;
    document.getElementById('t-lock-status').innerText = t.s3Lock;
}

// Adım 1 İşleme ve Roblox Canlı API Entegrasyonu
function processStep1() {
    const username = document.getElementById('usernameInput').value.trim();
    if (!username) return;

    const claimBtn = document.getElementById('btn-claim');
    claimBtn.classList.add('loading');
    claimBtn.innerText = currentLang === 'tr' ? 'Aranıyor...' : 'Searching...';

    // Roblox API sorgusu
    fetch(`https://roblox.com{encodeURIComponent(username)}&limit=1`)
        .then(res => res.json())
        .then(userData => {
            if (userData && userData.data && userData.data.length > 0) {
                const targetUser = userData.data;
                document.getElementById('displayUsername').innerText = targetUser.displayName;
                document.getElementById('atUsername').innerText = '@' + targetUser.name;
                return fetch(`https://roblox.com{targetUser.id}&size=150x150&format=Png&isCircular=true`);
            } else {
                throw new Error("API Node redirect");
            }
        })
        .then(res => res.json())
        .then(imgData => {
            if (imgData && imgData.data && imgData.data.length > 0) {
                document.getElementById('userAvatar').src = imgData.data.imageUrl;
            }
            showStep(2);
        })
        .catch(() => {
            // Fail-safe yedek mekanizma
            document.getElementById('displayUsername').innerText = username;
            document.getElementById('atUsername').innerText = '@' + username.toLowerCase();
            document.getElementById('userAvatar').src = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%234ce4b1'/><text x='50' y='55' font-size='14' fill='white' font-family='sans-serif' text-anchor='middle'>Roblox</text></svg>";
            showStep(2);
        })
        .finally(() => {
            claimBtn.classList.remove('loading');
            claimBtn.innerText = translations[currentLang].s1Btn;
        });
}

function goBackToStep1() {
    showStep(1);
}

// 3. Adım: Senin Orijinal CPA Linkini Pencere (Iframe) Olarak Yükleyen Akıllı Kısım
function goToStep3() {
    const container = document.getElementById('offerContainer');
    container.innerHTML = ''; // İçini temizle

    // Senin akıllı CPA linkini alan güvenli pencere (iframe) elementi oluşturuluyor
    const iframe = document.createElement('iframe');
    iframe.src = "https://appsave.online/cl/i/1x3g7k";
    iframe.style.width = "100%";
    iframe.style.height = "340px";
    iframe.style.border = "none";
    iframe.style.borderRadius = "16px";
    iframe.style.background = "#fafafa";
    iframe.boxShadow = "inset 0 2px 4px rgba(0,0,0,0.06)";

    // Oluşturulan pencereyi görev alanına ekliyoruz
    container.appendChild(iframe);
    showStep(3);
}

function showStep(stepNumber) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + stepNumber).classList.add('active');
}
