<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claim Your Reward</title>
    <!-- Google Fonts üzerinden Fredoka fontunu güvenli şekilde çağırıyoruz -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #51e1ec 0%, #4ce4b1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Sağ Üst Dil Seçim Menüsü */
        .lang-selector {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
        }
        .lang-selector select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 2px solid white;
            background: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            color: #333;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Ana Kart Tasarımı */
        .container {
            background: white;
            border-radius: 28px;
            width: 100%;
            max-width: 440px;
            padding: 30px 24px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.12);
            border: 4px solid #e0f9f1;
            text-align: center;
            position: relative;
        }

        /* Adım Geçiş Efektleri */
        .step {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 26px;
            color: #222;
            margin-bottom: 20px;
            text-shadow: 1px 1px 0px #fff;
            font-weight: 700;
        }

        .label {
            font-size: 18px;
            color: #444;
            font-weight: 600;
            text-align: left;
            margin-bottom: 8px;
            display: block;
        }

        /* Input Giriş Alanları */
        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 3px solid #e0e0e0;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 22px;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }
        input[type="text"]:focus {
            border-color: #4ce4b1;
            background: white;
        }

        /* Örneklerdeki 3D Buton Modellemesi */
        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            font-size: 26px;
            font-weight: 700;
            color: white;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.1s, filter 0.2s;
            display: inline-block;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.98);
        }

        .btn-green {
            background: #4de53b;
            border-bottom: 6px solid #36b127;
            text-shadow: 2px 2px 0px #319e24;
        }
        .btn-green:hover {
            filter: brightness(1.05);
        }

        .btn-red {
            background: #ff4747;
            border-bottom: 6px solid #cc2d2d;
            text-shadow: 2px 2px 0px #ba2323;
        }
        .btn-red:hover {
            filter: brightness(1.05);
        }

        /* 2. Adım: Kullanıcı Profil Doğrulama Kartı */
        .profile-card {
            background: #f7f7f7;
            border-radius: 18px;
            border: 2px solid #eaeaea;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 24px;
            text-align: left;
            position: relative;
        }
        .avatar-box {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #e0e0e0;
            border: 3px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-right: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-info h4 {
            font-size: 20px;
            color: #222;
            font-weight: 700;
            word-break: break-all;
        }
        .profile-info p {
            font-size: 15px;
            color: #777;
            font-weight: 400;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 3. Adım: CPA Offerwall Görevleri */
        .quest-subtitle {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .quest-subtitle span {
            color: #4de53b;
            font-weight: 700;
        }
        .offer-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }
        .offer-btn {
            font-size: 16px !important;
            padding: 12px 14px !important;
            text-shadow: none !important;
            text-transform: none !important;
            border-radius: 14px !important;
        }

        /* Kilitli Ödül Kodu Alanı */
        .lock-box {
            background: #2b303a;
            border-radius: 14px;
            padding: 14px;
            color: #a0a5b5;
            font-weight: 600;
            font-size: 14px;
            border: 2px dashed #444a56;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .lock-code {
            color: #f1c40f;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .loading {
            pointer-events: none;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="lang-selector">
        <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="tr">Türkçe</option>
            <option value="es">Español</option>
            <option value="pt">Porteguês</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <div class="container">
        
        <!-- ADIM 1: GİRİŞ PANELLERİ -->
        <div id="step1" class="step active">
            <h2 id="t-step1-title">Claim Your Reward</h2>
            <label class="label" id="t-label-code">Enter your code</label>
            <input type="text" id="promoCode" value="BG498" readonly>
            
            <label class="label" id="t-label-user">Roblox username</label>
            <input type="text" id="usernameInput" placeholder="Your username...">
            
            <button class="btn btn-green" id="btn-claim" onclick="processStep1()">Claim</button>
        </div>

        <!-- ADIM 2: REAL-TIME DOĞRULAMA -->
        <div id="step2" class="step">
            <h2 id="t-step2-title">Confirm Username</h2>
            <p class="quest-subtitle" id="t-is-this-you" style="margin-top:-10px; margin-bottom:15px;">Is this you?</p>
            
            <div class="profile-card">
                <div class="avatar-box">
                    <img id="userAvatar" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ccc'/></svg>" alt="Avatar">
                </div>
                <div class="profile-info">
                    <h4 id="displayUsername">Player</h4>
                    <p id="atUsername">@player</p>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-green" id="btn-yes" onclick="goToStep3()">Yes, it's me!</button>
                <button class="btn btn-red" id="btn-no" onclick="goBackToStep1()">No, try again</button>
            </div>
        </div>

        <!-- ADIM 3: JEOFEST (ÜLKE BAZLI TEKLİFLER) -->
        <div id="step3" class="step">
            <h2 id="t-step3-title">Final Step</h2>
            <p class="quest-subtitle" id="t-quest-desc">Complete <span>2 quests</span> to unlock your 1,000 Robux Giftcard</p>
            
            <div class="offer-list" id="offerContainer">
                <!-- Butonlar JavaScript tarafında otomatik doldurulacaktır -->
            </div>

            <div class="lock-box">
                <div class="lock-code">
                    🔒 RB??-????-????-????
                </div>
                <span id="t-lock-status">your code unlocks after completion...</span>
            </div>
        </div>

    </div>

    <script>
